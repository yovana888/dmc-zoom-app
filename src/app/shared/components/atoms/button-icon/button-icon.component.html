<button
  class="button"
  type="button"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="active()"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
  [attr.data-active]="active() ? 'true' : null"
  [disabled]="disabled()"
  (click)="disabled() ? null : handleClick.emit()"
>
  @if (imagePath()) {
    <img class="image-icon" [src]="imagePath()" [alt]="label()" />
  } @else {
    <ng-icon
      [name]="iconName()"
      [size]="iconSize()"
      [color]="resolvedColor()"
      [strokeWidth]="strokeWidth()"
      aria-hidden="true"
    />
  }
</button>
