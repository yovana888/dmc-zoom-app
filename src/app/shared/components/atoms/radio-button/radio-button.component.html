<label class="option">
  <input
    [id]="fieldId"
    class="native"
    type="radio"
    [name]="name()"
    [value]="value()"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onSelect()"
    (blur)="onBlur()"
  />
  <span class="mark" aria-hidden="true"></span>
  @if (label()) {
    <span class="text">{{ label() }}</span>
  }
</label>
